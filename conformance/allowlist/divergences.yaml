# Divergence allowlist for the native Sub-Store conformance gate (design 28).
#
# The list is closed: at most five entries, and adding, removing or widening
# one is a reviewed change to design 28, not a harness edit. check.mjs
# refuses a file with more than five entries or with an entry that does not
# follow the schema below. The five entries are the four divergences design
# 28 names and the line-safety entry its S2 decisions add. Each is pending
# until the slice that implements it removes `pending` and adds its
# normalisation; a pending entry holds its slot, is validated like any
# other, and applies to no comparison. external, underscore and ca have
# landed for S1, line-safety for S2; require stays pending until S3. The
# specifications refer to them by id (specs/normaliser.md, section 4, and
# the "Line safety" sections of specs/producers/surge.md, quantumultx.md,
# uri.md and v2ray.md).
#
# Schema of one entry:
#
#   - id: kebab-case, stable; conformance.json lists the ids it relied on
#     stage: parse | produce | script
#     pending: S1 to S6     (optional; the slice that lands the entry)
#     targets: [<target id>, ...] or ["*"]   (produce only; ids from
#              oracle/lib/targets.mjs; uri and v2ray, which are compared
#              byte for byte, only by name and only in an entry whose every
#              step is without_line_breaking_nodes; "*" skips them)
#     cases: [<non-empty case id prefix>, ...] or ["*"]   (exact case
#            ids, never "*", for an entry with a
#            without_line_breaking_nodes step)
#     upstream: what upstream does, in one or two sentences
#     chosen: what the plugin does instead
#     reason: why the plugin diverges
#     normalise:            applied to the golden and to the candidate before
#                           they are compared, only for matching stage,
#                           targets and cases; optional while pending
#       - strip_keys: <regex>              delete object keys (and URI query
#                                          keys) matching the pattern,
#                                          at any depth
#       - drop_entries:                    delete array elements that are
#           field: <key>                   objects whose field equals one
#           equals: [<value>, ...]         of the values, at any depth
#       - drop_entries_with_keys:          delete array elements that are
#           [<key>, ...]                   objects carrying any of the keys
#                                          (matched without regard to case),
#                                          at any depth; parse stage only
#       - without_line_breaking_nodes:     when the comparison still fails,
#           true                           compare the candidate with
#                                          <case>.line-safe.canon.json, the
#                                          golden upstream wrote for the
#                                          case's produce input without the
#                                          nodes that break a line: on a
#                                          lines or qx target every node in
#                                          which any text, key or value,
#                                          holds a control character, U+2028
#                                          or U+2029; on uri and v2ray only
#                                          such a node whose own link holds
#                                          one, and the bytes must then equal
#                                          <case>.line-safe.txt; produce
#                                          stage only, explicit targets whose
#                                          canonical form is lines, qx, uri
#                                          or v2ray, explicit cases matched
#                                          by exact id
#
# A strip_keys pattern may not match the empty key or any key in
# PROTECTED_KEYS (oracle/lib/allowlist.mjs: node identity, document
# containers, canonical structure), drop_entries needs at least one value,
# and drop_entries_with_keys may not name a node identity key or a document
# container (DROP_GUARD_KEYS) and applies only at parse stage, where every
# array element is a node, so one entry cannot hide a whole node list or
# document. without_line_breaking_nodes changes no value: regen.mjs writes
# the line-safe golden from the oracle, so the candidate must still match
# upstream exactly on every other node of the case, byte for byte on uri and
# v2ray.
#
# A divergence counts as allowed only when the comparison fails without the
# normalisation and passes with it; conformance.json records which ids were
# needed.
#
# The three S1 entries are parse-stage entries (S1 implementation plan,
# decision 18). Producers keep upstream's produce-stage behaviour in S1, so
# no produce-stage entry is needed there.
#
# external drops the elements whose type is external. Upstream's Clash
# reader rejects that type, so such a node only comes from a Surge external
# line, whose type keyword is lower case. Its second step states the other
# half of rule H3: a node of any type that carries exec, args, local-port,
# local-address or local_address is dropped too (clash-hostile-exec-key,
# tuic-hostile-exec-query). drop_entries_with_keys was added for this half
# (design 28, decision of 2026-10-09); before it, the schema could match a
# field's value but not a key's presence.
#
# underscore and ca apply to the cases whose nodes come from Clash or mihomo
# objects, which are the cases whose ids start with clash-. In every other
# case an underscore key is a parser annotation both sides produce
# (specs/normaliser.md, section 6). The corpus never points _ca at a file
# that exists, so the key is the only difference ca has to hide.
#
# line-safety is the S2 produce-stage entry (design 28, S2 decisions). It
# first named the two corpus cases whose Surge or Quantumult X golden
# carries a line break from a field: clash-socks5-name-newline (a name
# holding a newline) and clash-ssh (an inline PEM private key, which Surge
# writes into the line). The KI-27 lane extended it to uri and v2ray, whose
# links upstream writes with the same raw fields, and named the line-safety
# cases of specs/producers/uri.md, each of which carries a line break in a
# field at least one of the four targets writes raw. Targets and cases are a
# cross product, so on a target a case's line break does not reach, the
# line-safe golden is upstream's own output: on uri and v2ray regen.mjs
# leaves out only a node whose own link holds a line break, so clash-ssh
# (no URI form) and clash-trojan-name-newline (the fragment encodes the
# newline) get no uri or v2ray line-safe golden at all; on surge and
# quantumultx a node of a type the target has no form for changes nothing.
# Because of its without_line_breaking_nodes step the entry matches its ids
# exactly, not as prefixes, so it does not cover clash-ssh-key-path or any
# later case whose id starts with a named one. A new corpus case with a line
# break in a field these targets write fails until this entry names its
# exact id.
divergences:
  - id: external
    stage: parse
    upstream: >-
      Parses a Surge external line into a node of type external with its
      exec, args and local-port, keeps any proxy that carries an exec-style
      key, and producers such as Surge for Mac, ClashMeta and JSON write them
      back out.
    chosen: >-
      The normaliser drops external and exec-shaped nodes from remote and
      pasted input and keeps them only on a local record whose operator set
      the explicit opt-in (specs/normaliser.md, rule H3).
    reason: >-
      An external entry makes the client that installs the profile run a
      local command, so a provider feed or pasted text must not be able to
      add one.
    normalise:
      - drop_entries:
          field: type
          equals: [external]
      - drop_entries_with_keys: [exec, args, local-port, local-address, local_address]
  - id: underscore
    stage: parse
    cases: [clash-]
    upstream: >-
      Keeps every key starting with an underscore that a Clash or mihomo
      object carries, at any depth, and acts on some of them (an input
      _loon_tls_profile triggers a normalisation step).
    chosen: >-
      The normaliser strips underscore keys from object input
      (specs/normaliser.md, rule H1); underscore fields a script sets live in
      the model's script map and never reach a producer.
    reason: >-
      Underscore keys are upstream's internal annotations, and accepting them
      from input lets a feed steer internal behaviour.
    normalise:
      - strip_keys: ^_
  - id: ca
    stage: parse
    cases: [clash-]
    upstream: >-
      Reads the local file a _ca field names to compute the certificate
      fingerprint.
    chosen: >-
      Never reads a file; the fingerprint comes only from ca-str or ca_str
      (specs/normaliser.md, rule H2).
    reason: >-
      A field from a feed must not make the plugin read a local path.
    normalise:
      - strip_keys: ^_ca$
  - id: require
    stage: script
    pending: S3
    upstream: >-
      Runs operator scripts with Node's require available.
    chosen: >-
      require is unresolved in the script isolate, and the editor says why
      (design 28, script surface).
    reason: >-
      require reaches the filesystem, the network and the host process outside
      every budget and grant a script runs under.
  - id: line-safety
    stage: produce
    targets: [surge, quantumultx, uri, v2ray]
    cases:
      - clash-socks5-name-newline
      - clash-ssh
      - clash-anytls-password-newline
      - clash-hysteria-auth-str-newline
      - clash-hysteria-key-newline
      - clash-socks5-name-line-separators
      - clash-trojan-name-newline
      - clash-trojan-password-newline
      - clash-trojan-server-newline
      - clash-v2ray-line-safety-mixed
      - clash-vless-uuid-newline
      - clash-vmess-reality-uuid-newline
      - clash-vmess-uuid-newline
    upstream: >-
      Writes node text into Surge and Quantumult X lines and into URI and
      V2Ray share links as it is, so a name, password, server, uuid, path,
      key or field name that holds a line break adds lines of its own: a
      [Script], [Rule] or [MITM] section in a profile, or a share link the
      provider wrote into the served list.
    chosen: >-
      The producer rejects a node whose entry or link would hold a control
      character, U+2028 or U+2029, and the Surge module header drops those
      characters from the subscription name (specs/producers/surge.md,
      quantumultx.md, uri.md and v2ray.md, "Line safety"). A rejected node
      leaves no line, not even an empty one in the V2Ray text.
    reason: >-
      A provider feed must not be able to add sections or proxy lines to the
      profile the operator's client imports, which is the line-format
      counterpart of rule H3's exec-shaped nodes; an injected share link was
      never a node, so it would skip the normaliser and every operator.
    normalise:
      - without_line_breaking_nodes: true
