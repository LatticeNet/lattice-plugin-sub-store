name: ci

on:
  push:
    branches: [main, integration]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          # Part of the signed byte contract (README, Local verification).
          # An exact patch version makes setup-go fetch it from go.dev.
          go-version: '1.26.9'
          cache-dependency-path: |
            system-go/go.mod
            tools/pluginpack/go.mod
            tools/perfgate/go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: check formatting
        run: test -z "$(gofmt -l system-go tools/pluginpack tools/perfgate)"

      - name: prepare temporary Go workspace
        run: |
          mkdir -p "$RUNNER_TEMP/gowork"
          cd "$RUNNER_TEMP/gowork"
          go work init "$GITHUB_WORKSPACE/system-go" "$GITHUB_WORKSPACE/tools/pluginpack" "$GITHUB_WORKSPACE/tools/perfgate"
          echo "GOWORK=$RUNNER_TEMP/gowork/go.work" >> "$GITHUB_ENV"

      - name: go vet
        run: go vet ./system-go/... ./tools/pluginpack/... ./tools/perfgate/...

      - name: govulncheck
        # govulncheck needs a go.mod in its working directory; GOWORK still
        # applies there. The version is pinned so a new release cannot change
        # what this step judges without a reviewed edit here.
        working-directory: system-go
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: test system runtime
        # The union of the snapshot-render and graph suites pushes system-go
        # past go test's 10m default under -race; the overrun is aggregate
        # engine-boot cost, not a hang.
        run: go test -race -timeout 25m ./system-go/...

      - name: test deterministic packer
        run: go test -race ./tools/pluginpack/...

      - name: test perf gate
        run: go test -race ./tools/perfgate/...

      - name: test Sub-Store core tooling
        run: node --test tools/substore-core/build.test.mjs tools/substore-core/audit-state.test.mjs

      - name: install UI dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: ui
        run: npm ci

      - name: test UI
        working-directory: ui
        run: npm test

      - name: typecheck UI
        working-directory: ui
        run: npm run typecheck

      - name: build and scan UI
        working-directory: ui
        run: |
          npm run build
          npm run verify:build

      - name: validate manifest against reviewed server
        env:
          # alpha-0.2.2a123 release commit e987e16, the S0 server release whose
          # checker knows the capability-wave manifest.
          # Move ONLY to another released tag's commit.
          LATTICE_CHECK_REF: v0.2.4-0.20261009034729-e987e1606b03
        run: go run "github.com/LatticeNet/lattice-server/cmd/lattice-plugin-manifest-check@${LATTICE_CHECK_REF}" manifest.json

      - name: build runtime binaries
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p "$RUNNER_TEMP/bundle-src/bin/linux-amd64" "$RUNNER_TEMP/bundle-src/bin/linux-arm64"
          GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/bundle-src/bin/linux-amd64/plugin" ./system-go
          GOOS=linux GOARCH=arm64 go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/bundle-src/bin/linux-arm64/plugin" ./system-go

      - name: assemble UI bundle tree
        run: |
          mkdir -p "$RUNNER_TEMP/bundle-src/ui"
          cp -R ui/dist/. "$RUNNER_TEMP/bundle-src/ui"
          test -f "$RUNNER_TEMP/bundle-src/ui/index.html"
          test -d "$RUNNER_TEMP/bundle-src/ui/assets"

      - name: package twice and compare bytes
        run: |
          digest_one="$(go run ./tools/pluginpack/cmd/pluginpack -source "$RUNNER_TEMP/bundle-src" -output "$RUNNER_TEMP/sub-store-1.tar.gz")"
          find "$RUNNER_TEMP/bundle-src" -exec touch -t 202601010101 {} +
          digest_two="$(go run ./tools/pluginpack/cmd/pluginpack -source "$RUNNER_TEMP/bundle-src" -output "$RUNNER_TEMP/sub-store-2.tar.gz")"
          expected="$(node -p "require('./manifest.json').bundle.digest_sha256")"
          printf 'bundle digest actual=%s expected=%s\n' "$digest_one" "$expected"
          test "$digest_one" = "$digest_two"
          test "$digest_one" = "$expected"
          cmp -s "$RUNNER_TEMP/sub-store-1.tar.gz" "$RUNNER_TEMP/sub-store-2.tar.gz"

      - name: publish canonical bundle
        # The deterministic pack above is the digest authority (darwin and
        # arm64 containers do not reproduce it), so the signing ceremony
        # downloads these exact bytes instead of rebuilding and hoping.
        uses: actions/upload-artifact@v4
        with:
          name: canonical-bundle
          path: |
            ${{ runner.temp }}/sub-store-1.tar.gz
          retention-days: 30

      - name: git diff check
        run: git diff --check

  conformance:
    # The vendored checker (conformance/oracle/check.mjs, run as it is) judges
    # the native parser and the five native producers through the runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.9'
          cache-dependency-path: system-go/go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: conformance/oracle/package-lock.json

      - name: build the conformance runner
        # check.mjs runs with the data root as its working directory, so the
        # candidate path is absolute.
        working-directory: system-go
        run: go build -o "$RUNNER_TEMP/substore-conformance" ./cmd/substore-conformance

      - name: install the checker
        run: npm ci --prefix conformance/oracle

      - name: test the end-to-end judge
        run: node --test tools/conformance-end-to-end.test.mjs

      - name: judge parse and the five native targets
        # From the golden nodes. Exit 1 is a failed comparison, 2 a run whose
        # numbers differ from conformance/conformance.json (a corpus, golden
        # or allowlist change regenerates it with --conformance in the same
        # commit), 3 a harness error.
        run: >-
          node conformance/oracle/check.mjs --candidate "$RUNNER_TEMP/substore-conformance"
          --targets uri,v2ray,json,singbox,clashmeta
          --conformance "$RUNNER_TEMP/conformance.json" --expect conformance/conformance.json
          --report "$RUNNER_TEMP/conformance-report.json"

      - name: judge end to end from the runner's own parse
        # A case whose parse matches only under the allowlist cannot match
        # produce goldens written from nodes Lattice does not build, so the
        # end-to-end run is judged by tools/conformance-end-to-end.mjs, with
        # a strict parse run (an empty allowlist) naming those cases.
        run: |
          node conformance/oracle/check.mjs --candidate "$RUNNER_TEMP/substore-conformance" \
            --targets uri,v2ray,json,singbox,clashmeta --end-to-end --no-fail \
            --report "$RUNNER_TEMP/end-to-end-report.json"
          printf 'divergences: []\n' > "$RUNNER_TEMP/no-allowlist.yaml"
          node conformance/oracle/check.mjs --candidate "$RUNNER_TEMP/substore-conformance" \
            --targets uri --allowlist "$RUNNER_TEMP/no-allowlist.yaml" --no-fail --quiet \
            --report "$RUNNER_TEMP/strict-parse-report.json"
          node tools/conformance-end-to-end.mjs "$RUNNER_TEMP/end-to-end-report.json" "$RUNNER_TEMP/strict-parse-report.json"

      - name: keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-reports
          path: |
            ${{ runner.temp }}/conformance.json
            ${{ runner.temp }}/conformance-report.json
            ${{ runner.temp }}/end-to-end-report.json
            ${{ runner.temp }}/strict-parse-report.json
          retention-days: 30

  perf:
    # Wall-clock gates (S1 plan section 5.2) on a fixed runner image, judged
    # by tools/perfgate against the baseline committed from this job's own
    # output.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.9'
          cache-dependency-path: |
            system-go/go.mod
            tools/perfgate/go.mod

      - name: run the pipeline and producer benchmarks ten times
        working-directory: system-go
        run: go test -run '^$' -bench 'Pipeline|Produce4096' -count 10 -benchmem ./... | tee "$RUNNER_TEMP/bench.txt"

      - name: judge the medians
        working-directory: tools/perfgate
        run: go run . -baseline "$GITHUB_WORKSPACE/system-go/testdata/bench/ubuntu-24.04.txt" -current "$RUNNER_TEMP/bench.txt"

      - name: keep the benchmark output
        # A deliberate baseline move commits this file as
        # system-go/testdata/bench/ubuntu-24.04.txt.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-ubuntu-24.04
          path: ${{ runner.temp }}/bench.txt
          retention-days: 30

  memory:
    # The allocation and heap gates need a binary without the race detector,
    # which allocates on its own account, and the worker's resident set is
    # read from /proc.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.9'
          cache-dependency-path: system-go/go.mod

      - name: allocation and heap gates
        working-directory: system-go
        run: go test -count=1 -run '^(TestPipelineAllocsPerNodeBound|TestHeapInuseAfter4096Render)$' -v .

      - name: build the worker as the release does
        working-directory: system-go
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/plugin" .

      - name: record the worker's resident set
        # Recorded, not enforced, until S2.
        working-directory: system-go
        env:
          LATTICE_WORKER_BINARY: ${{ runner.temp }}/plugin
        run: go test -count=1 -run '^TestWorkerVmRSS$' -v . | tee "$RUNNER_TEMP/memory.txt"

      - name: keep the record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-ubuntu-24.04
          path: ${{ runner.temp }}/memory.txt
          retention-days: 30

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.9'
          cache-dependency-path: system-go/go.mod

      - name: run every fuzz target for 30s
        # -fuzz takes one target in one package, so each Fuzz function found
        # by go test -list runs on its own. None exists until the parser lane
        # adds them; the loop then picks them up without a workflow change.
        working-directory: system-go
        run: |
          found=0
          for pkg in $(go list ./...); do
            names=$(go test -list '^Fuzz' "$pkg")
            for name in $(printf '%s\n' "$names" | grep '^Fuzz' || true); do
              found=1
              echo "fuzzing $name in $pkg"
              go test -run '^$' -fuzz "^${name}\$" -fuzztime 30s "$pkg"
            done
          done
          if [ "$found" = 0 ]; then echo "no Fuzz targets in system-go yet"; fi

  ui-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: install UI dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: ui
        run: npm ci

      - name: install Chromium for Playwright
        working-directory: ui
        run: npx playwright install --with-deps chromium

      - name: run the Playwright suite
        working-directory: ui
        run: npm run test:e2e
