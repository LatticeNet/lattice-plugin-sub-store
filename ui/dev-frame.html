<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sub-Store, framed</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: start center; background: #2a2a2e; padding: 24px 0; }
      iframe { border: 0; border-radius: 6px; background: #fff; box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4); }
    </style>
  </head>
  <body>
    <!-- The same harness inside a frame of a fixed width, so a review at 375
         or 1440 does not depend on the browser window. `w` and `h` size the
         frame (375 by 812 unless given); every other query parameter is
         handed through, so ?state=empty and ?conflict=1 work here too. -->
    <iframe id="frame" title="Sub-Store plugin frame"></iframe>
    <script type="module">
      const params = new URLSearchParams(window.location.search);
      const frame = document.getElementById("frame");
      frame.width = params.get("w") ?? "375";
      frame.height = params.get("h") ?? "812";
      params.delete("w");
      params.delete("h");
      const rest = params.toString();
      frame.src = "/dev.html" + (rest ? `?${rest}` : "");
    </script>
  </body>
</html>
